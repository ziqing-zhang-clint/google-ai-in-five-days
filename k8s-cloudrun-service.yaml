# ==============================================================================
# Infrastructure as Code (IaC): Google Cloud Run Knative Service Manifest
# Declarative Kubernetes / Cloud Run API v1 Specification for NexusOps Fleet
# ==============================================================================
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: nexus-enterprise-ops-agent
  namespace: default
  labels:
    cloud.googleapis.com/location: us-central1
    app.kubernetes.io/name: nexus-enterprise-ops-agent
    app.kubernetes.io/part-of: nexus-ops
    environment: production
  annotations:
    run.googleapis.com/ingress: all
    run.googleapis.com/description: "NexusOps Enterprise Operations Multi-Agent Platform"
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "1"
        autoscaling.knative.dev/maxScale: "10"
        run.googleapis.com/execution-environment: gen2
        run.googleapis.com/cpu-throttling: "false"
    spec:
      serviceAccountName: nexus-ops-agent-sa@${PROJECT_ID}.iam.gserviceaccount.com
      timeoutSeconds: 300
      containerConcurrency: 80
      containers:
        - name: agent-runtime
          image: gcr.io/${PROJECT_ID}/nexus-ops-agent:latest
          resources:
            limits:
              cpu: "2000m"
              memory: "2Gi"
          ports:
            - name: http1
              containerPort: 8000
          env:
            - name: ENVIRONMENT
              value: "production"
            - name: LOG_LEVEL
              value: "INFO"
            - name: NEXUS_FRONTIER_MODEL
              value: "gemini-2.5-pro"
            - name: NEXUS_FAST_MODEL
              value: "gemini-2.5-flash"
            - name: HITL_MANDATORY_THRESHOLD_USD
              value: "250.00"
            - name: OTEL_SERVICE_NAME
              value: "nexus-enterprise-ops-agent"
            - name: OTEL_TRACES_ENABLED
              value: "true"
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: nexus-gemini-api-key
                  key: latest
          startupProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            periodSeconds: 15
            failureThreshold: 3
---
# Ingress Binding Policy for Public HTTPS Invocation
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: nexus-ops-public-invoker
subjects:
  - kind: Group
    name: allUsers
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: ClusterRole
  name: roles/run.invoker
  apiGroup: rbac.authorization.k8s.io
