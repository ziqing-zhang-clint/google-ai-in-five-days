name: NexusOps CI/CD & Automated Evaluation Suite

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-and-evaluate:
    name: Test, Lint & Benchmark Evaluation Gate
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-asyncio pytest-cov ruff

    - name: Run Ruff Linting & Static Analysis
      run: |
        ruff check nexus_ops/ tests/ evals/

    - name: Execute Full Unit & Integration Test Suite
      run: |
        pytest tests/ -v --cov=nexus_ops --cov-report=term-missing

    - name: Execute Automated Golden Benchmark Evals (Quality Gate)
      run: |
        python -m evals.run_evals

  container-build:
    name: Build & Validate Docker Container
    runs-on: ubuntu-latest
    needs: test-and-evaluate

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Docker Image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: false
        tags: nexus-enterprise-ops-agent:latest
