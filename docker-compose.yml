version: '3.8'

services:
  nexus-ops-agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nexus_enterprise_ops_agent
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - LOG_LEVEL=INFO
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - DATABASE_URL=sqlite:////data/nexus_ops_sessions.db
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - NEXUS_FRONTIER_MODEL=${NEXUS_FRONTIER_MODEL:-gemini-2.5-pro}
      - OTEL_SERVICE_NAME=nexus-enterprise-ops-agent
      - OTEL_TRACES_ENABLED=true
    volumes:
      - nexus_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped

volumes:
  nexus_data:
    driver: local
